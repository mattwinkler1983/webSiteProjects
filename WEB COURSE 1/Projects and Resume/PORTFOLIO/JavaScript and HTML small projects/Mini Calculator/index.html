<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Calculator</title>
    <link rel="stylesheet" href="miniCalculator.css">
    <script src="miniCalculator.js" defer></script>
</head>
<body>
    <h1>My Calculator</h1>

    <!-- Calculator screen -->
    <input type="text" id="calculator" readonly>

    <!-- Buttons container -->
    <div id="buttons-calculator">
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>x</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
        </div>
        <div>
            <button>0</button>
            <button>.</button> <!-- decimal point -->
            <button>=</button>
            <button>+</button>
        </div>
        <div>
            <button>C</button> <!-- clear -->
            <button>DEL</button> <!-- delete last character -->
        </div>
    </div>
</body>
</html>
